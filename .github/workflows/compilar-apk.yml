
name: Compilar StockPro APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  compilar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail
          curl -fL \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Verificar proyecto
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts || test -f settings.gradle
          test -f build.gradle.kts || test -f build.gradle
          test -f app/build.gradle.kts || test -f app/build.gradle
          echo "Estructura Android encontrada."

      - name: Compilar APK
        run: gradle assembleDebug --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: StockPro-Premium-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
