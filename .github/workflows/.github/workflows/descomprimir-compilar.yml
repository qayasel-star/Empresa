
name: Descomprimir y compilar StockPro

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar herramientas
        run: sudo apt-get update && sudo apt-get install -y unzip rsync

      - name: Descomprimir proyecto
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$GITHUB_WORKSPACE/StockPro-Premium-Proyecto-Completo.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: No se encontró el ZIP oficial."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/stockpro"
          unzip -t "$ZIP"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/stockpro"

          SETTINGS=$(find "$RUNNER_TEMP/stockpro" \
            -type f \( -name settings.gradle.kts \
            -o -name settings.gradle \) -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No se encontró settings.gradle."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] \
            && [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: No se encontró el módulo Android app."
            exit 1
          fi

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            "$PROJECT_DIR/" "$GITHUB_WORKSPACE/"

      - name: Instalar Gradle 8.9
        run: |
          set -euo pipefail
          curl -fL \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" \
            -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Compilar APK
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: StockPro-Premium-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
