
name: Extraer proyecto Android

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extraer:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Extraer y localizar proyecto
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: No se encontró ningún ZIP en la raíz."
            exit 1
          fi

          TMP="$RUNNER_TEMP/proyecto-extraido"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"

          echo "=== ARCHIVOS DEL ZIP ==="
          find "$TMP" -maxdepth 5 -type f | head -200

          SETTINGS="$(find "$TMP" -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: El ZIP no contiene settings.gradle ni settings.gradle.kts."
            echo "No se puede confirmar que contenga un proyecto Android compilable."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "Proyecto encontrado en: $PROJECT_DIR"

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            "$PROJECT_DIR"/ ./

          echo "=== ARCHIVOS EXTRAÍDOS EN LA RAÍZ ==="
          ls -la
          test -f settings.gradle || test -f settings.gradle.kts

      - name: Guardar proyecto en GitHub
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "No hay cambios nuevos para guardar."
          else
            git commit -m "Extraer proyecto Android desde ZIP"
            git push
          fi
